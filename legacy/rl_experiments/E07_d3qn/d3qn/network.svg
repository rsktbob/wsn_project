<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1008" viewBox="0 0 1000 1008" font-family="Helvetica, Arial, 'Noto Sans CJK TC', sans-serif" font-size="12">
  <rect width="1000" height="1008" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2C2C2A">E07 D3QN（簡單版）：同樣的候選編碼＋Dueling，30 張圖完整 lifetime、每段預算 1000</text>

  <!-- ① 問題設定 -->
  <rect x="30" y="50" width="940" height="62" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="500" y="70" text-anchor="middle" font-weight="bold" fill="#2C2C2A">① 問題設定（同 E06）：原版 ring_se（n8 h4 w8 μ0.4，EN），每回合 64 組交易，每組在 4 個預抽候選範圍（80/20）裡選 1 個</text>
  <text x="500" y="87" text-anchor="middle" fill="#2C2C2A">網路替 4 個候選各打一個分數，選分數最高的；4 個候選用同一組權重（候選順序換了，結果跟著換）</text>
  <text x="500" y="104" text-anchor="middle" fill="#993C1D">預算 1000（seed 7–11）：原版 ring_se 899.9；作弊版（偷看 4 候選只交換的 Δ）982.1（+9.1%）</text>


  <!-- ② 環境 -->
  <rect x="30" y="124" width="940" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="50" y="146" font-size="14" font-weight="bold" fill="#0C447C">② 環境與獎勵（不偷看，網路自己推進）</text>
  <g fill="#0C447C">
    <text x="50" y="168"><tspan font-weight="bold">RLTRAIN01–30</tspan>（同監督式）每張從滿電跑完整 lifetime，<tspan font-weight="bold">每段預算 1000</tspan>（使用者 10/19 從 10000 改）；一段最佳化（約 8 回合）＝一個 episode</text>
    <text x="50" y="186">一張圖約 32 個 episode，<tspan font-weight="bold">只跑 1 輪（約 950 個 episode）</tspan>，地圖順序打亂</text>
    <text x="50" y="204"><tspan font-weight="bold">獎勵</tspan>：同 E06 差異獎勵，用實際子代（含突變）；÷ 上一回合一般 Δ 的正值中位數、上限 5</text>
    <text x="50" y="220" font-size="11">差異獎勵：同一個 searcher 的 8 組只會收最好的 child1 → 只有真的被收下的那組拿到「比其他組多出來的部分」</text>
  </g>

  <rect x="20" y="238" width="960" height="518" rx="12" fill="none" stroke="#534AB7" stroke-dasharray="7 4"/>
  <text x="40" y="260" font-size="14" font-weight="bold" fill="#534AB7">③ 網路（約 3.7 萬參數；E06 是 15.4 萬）：4 個候選各走一條路，4 條路是<tspan fill="#993C1D">同一個網路、同一組權重</tspan>，最後才放在一起比</text>
  <text x="40" y="290" font-size="12" font-weight="bold" fill="#085041">共用輸入</text>
  <text x="40" y="305" font-size="11" fill="#5F5E5A">4 條路都會用到</text>
  <rect x="180" y="274" width="780" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="570" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選特徵 4×10（每個候選一列：位置 4、範圍外影響 4、瓶頸 2）　‖　全域 10（4 個候選用同一份）</text>
  <text x="40" y="342" font-size="12" font-weight="bold" fill="#085041">輸入</text>
  <text x="40" y="357" font-size="11" fill="#5F5E5A">範圍內的 sensor</text>

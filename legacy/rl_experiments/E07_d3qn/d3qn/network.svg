  <text x="468" y="358" text-anchor="middle" font-size="11" fill="#085041">L2 × 25（例 L2 ＝ 25）</text>
  <line x1="468.0" y1="364" x2="468.0" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="326" width="184" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>

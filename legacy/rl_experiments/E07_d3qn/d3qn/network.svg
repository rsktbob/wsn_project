  <text x="468" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="468.0" y1="468" x2="468.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="664" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="664" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="664.0" y1="468" x2="664.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="860" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="860" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="860.0" y1="468" x2="860.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="498" font-size="12" font-weight="bold" fill="#3C3489">第 3 步</text>
  <text x="40" y="513" font-size="11" fill="#5F5E5A">加上候選特徵、全域</text>
  <rect x="180" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="272" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 1 特徵 10 ‖ 全域 10</text>
  <text x="272" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u1</text>
  <line x1="272.0" y1="520" x2="272.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="468" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 2 特徵 10 ‖ 全域 10</text>
  <text x="468" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u2</text>
  <line x1="468.0" y1="520" x2="468.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="664" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 3 特徵 10 ‖ 全域 10</text>
  <text x="664" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u3</text>
  <line x1="664.0" y1="520" x2="664.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="860" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 4 特徵 10 ‖ 全域 10</text>
  <text x="860" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u4</text>
  <line x1="860.0" y1="520" x2="860.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="550" font-size="12" font-weight="bold" fill="#633806">第 4 步</text>
  <text x="40" y="565" font-size="11" fill="#5F5E5A">每個候選的優勢</text>
  <rect x="180" y="534" width="184" height="38" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="272" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">u1 → 1 ＝ A1</text>
  <text x="272" y="566" text-anchor="middle" font-size="11" fill="#633806">比平均好多少</text>
  <rect x="376" y="534" width="184" height="38" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="468" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">u2 → 1 ＝ A2</text>
  <text x="468" y="566" text-anchor="middle" font-size="11" fill="#633806">比平均好多少</text>
  <rect x="572" y="534" width="184" height="38" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="664" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">u3 → 1 ＝ A3</text>
  <text x="664" y="566" text-anchor="middle" font-size="11" fill="#633806">比平均好多少</text>
  <rect x="768" y="534" width="184" height="38" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="860" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">u4 → 1 ＝ A4</text>
  <text x="860" y="566" text-anchor="middle" font-size="11" fill="#633806">比平均好多少</text>
  <line x1="272.0" y1="572" x2="272.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468.0" y1="572" x2="468.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="664.0" y1="572" x2="664.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860.0" y1="572" x2="860.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="594" width="780" height="44" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="570" y="613" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">V ＝ 平均(u1, u2, u3, u4) → 64 → 1：這組交易整體能改善多少（4 個候選共用一個 V）</text>
  <text x="570" y="630" text-anchor="middle" font-size="10" fill="#633806">V 用第 3 步的 u 算；A1…A4 直接往下傳到第 6 步</text>
  <text x="40" y="610" font-size="12" font-weight="bold" fill="#633806">第 5 步</text>
  <text x="40" y="625" font-size="11" fill="#5F5E5A">整體價值</text>
  <line x1="570" y1="638" x2="570" y2="652" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="654" width="780" height="44" rx="6" fill="#534AB7" stroke="#534AB7"/>
  <text x="570" y="673" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Qc ＝ V ＋ Ac − 平均(A1…A4)　→　Q1、Q2、Q3、Q4</text>
  <text x="570" y="690" text-anchor="middle" font-size="11" fill="#ffffff">Q ＝ 選這個候選的預期獎勵；選 Q 最大，訓練時 ε-greedy</text>
  <text x="40" y="672" font-size="12" font-weight="bold" fill="#534AB7">第 6 步</text>
  <text x="40" y="687" font-size="11" fill="#5F5E5A">4 個 Q 一起比</text>
  <text x="570" y="716" text-anchor="middle" font-size="11" fill="#5F5E5A">例：A＝0.2、1.0、−0.8、−0.4（平均 0），V＝0.5 → Q＝0.7、1.5、−0.3、0.1 → 選候選 2</text>
  <text x="40" y="738" font-size="11" fill="#993C1D">和 E06 比：拿掉 sensor Transformer、範圍外 sensor、候選間 attention。E06 拿掉 Transformer（0 層）945.7 對 944.6，沒差</text>

  <!-- ④ 訓練 -->
  <rect x="30" y="772" width="940" height="150" rx="10" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="50" y="796" font-size="14" font-weight="bold" fill="#0C447C">④ 訓練（train_rl.py）</text>
  <g fill="#0C447C">
    <text x="50" y="822"><tspan font-weight="bold">目標</tspan>　γ = 0：讓 Q_(選的候選) 接近實際拿到的獎勵 r（Huber）；Dueling、PER（α 0.4、β 0.6→1）</text>
    <text x="50" y="840" font-size="11">　　　　例：選了候選 2、Q2＝1.5，實際獎勵 r＝0.8 → 把 Q2 往 0.8 拉（只更新選到的那個）；γ = 0 時目標就是 r，不需要 target network、Double DQN（程式沒有實作）</text>
    <text x="50" y="864"><tspan font-weight="bold">Replay</tspan>　FIFO 上限 15,000 回合（預算 1000 時全部只約 7,600 回合 → 等於全留，同 E06），PER 抽樣在 GPU 上做</text>
    <text x="50" y="886"><tspan font-weight="bold">設定</tspan>　從零、ε 1.0 → 0.05（前 50% episode）、warmup 5,000 組、每回合更新 16 次（同 E06；共約 12 萬次）、batch 128、lr 1e-4、L2 1e-5</text>
    <text x="50" y="906"><tspan font-weight="bold">驗證</tspan>　訓練中不驗證；每 100 episode 存 checkpoint，評估用最後一個；記錄每張訓練圖的 lifetime 當學習曲線</text>
  </g>

  <!-- ⑤ 評估 -->
  <rect x="30" y="934" width="940" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="500" y="954" text-anchor="middle" font-weight="bold" fill="#085041">⑤ 評估：MAP01–06 × seed 7–11（30 場），預算 1000，成對 Wilcoxon 對同場 ring_se 899.9</text>
  <text x="500" y="972" text-anchor="middle" fill="#085041">對照：E07 監督式（差異獎勵、預算 1000 標籤）947.6 · E06 監督式 950.3 · 作弊版 982.1（同場 seed 7–11）</text>
  <text x="500" y="988" text-anchor="middle" font-size="11" fill="#993C1D">時間：訓練約 30 分 → 評估約 5 分；E06 從零 RL 比監督式低約 1%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="926" viewBox="0 0 1000 926" font-family="Helvetica, Arial, 'Noto Sans CJK TC', sans-serif" font-size="12">
  <rect width="1000" height="926" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2C2C2A">E07 監督式（簡單版）：學作弊版選 4 個候選中的哪一個</text>

  <!-- ① 問題設定 -->
  <rect x="30" y="50" width="940" height="62" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="500" y="70" text-anchor="middle" font-weight="bold" fill="#2C2C2A">① 問題設定（同 E06）：原版 ring_se（n8 h4 w8 μ0.4，EN），每回合 64 組交易，每組在 4 個預抽候選範圍（80/20）裡選 1 個</text>
  <text x="500" y="87" text-anchor="middle" fill="#2C2C2A">網路替 4 個候選各打一個分數，選分數最高的；4 個候選用同一組權重（候選順序換了，結果跟著換）</text>
  <text x="500" y="104" text-anchor="middle" fill="#993C1D">預算 10000：原版 ring_se 1064.6（seed 7–36）；作弊版（偷看 4 候選只交換的 Δ）只多 +1.5%（1060.7 → 1076.2，seed 7–16）</text>


  <!-- ② 標籤資料 -->
  <rect x="30" y="124" width="940" height="100" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="50" y="146" font-size="14" font-weight="bold" fill="#633806">② 標籤資料（collect.py 全部重新蒐集，不用舊資料）</text>
  <g fill="#633806">
    <text x="50" y="168"><tspan font-weight="bold">RLTRAIN01–30</tspan>：每張從滿電用<tspan font-weight="bold">原版 ring_se 推進</tspan>（4 選 1 隨機），<tspan font-weight="bold">每段預算 10000</tspan>（約 78 回合），跑完整 lifetime（約 34 段）</text>
    <text x="50" y="186">每 3 段標一段、起點依地圖錯開；<tspan font-weight="bold">作弊版只負責標答案</tspan>：偷看 4 個候選「只交換」的結果（不計預算、不用演算法亂數 → 推進和原版完全相同）</text>
    <text x="50" y="204"><tspan font-weight="bold">標籤 ＝ 作弊版會選的候選</tspan>：一般 Δ ＝ max(0, f(c1) − f(S)) ＋ max(0, f(c2) − f(G)) 最大的，同分再比 f(c2)；每組交易都有答案</text>
    <text x="50" y="220" font-size="11">預估約 180 萬組交易、約 1.5 GB、8 shard 約 1 小時；不另切驗證圖</text>
  </g>

  <rect x="20" y="238" width="960" height="458" rx="12" fill="none" stroke="#534AB7" stroke-dasharray="7 4"/>
  <text x="40" y="260" font-size="14" font-weight="bold" fill="#534AB7">③ 網路（約 3.3 萬參數；E06 是 15.4 萬）：4 個候選各走一條路，4 條路是<tspan fill="#993C1D">同一個網路、同一組權重</tspan>，最後才放在一起比</text>
  <text x="40" y="290" font-size="12" font-weight="bold" fill="#085041">共用輸入</text>
  <text x="40" y="305" font-size="11" fill="#5F5E5A">4 條路都會用到</text>
  <rect x="180" y="274" width="780" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="570" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選特徵 4×10（每個候選一列：位置 4、範圍外影響 4、瓶頸 2）　‖　全域 10（4 個候選用同一份）</text>
  <text x="40" y="342" font-size="12" font-weight="bold" fill="#085041">輸入</text>
  <text x="40" y="357" font-size="11" fill="#5F5E5A">範圍內的 sensor</text>
  <rect x="180" y="326" width="184" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="272" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選 1：範圍內 sensor</text>
  <text x="272" y="358" text-anchor="middle" font-size="11" fill="#085041">L1 × 25（例 L1 ＝ 3）</text>
  <line x1="272.0" y1="364" x2="272.0" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="326" width="184" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="468" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選 2：範圍內 sensor</text>
  <text x="468" y="358" text-anchor="middle" font-size="11" fill="#085041">L2 × 25（例 L2 ＝ 25）</text>
  <line x1="468.0" y1="364" x2="468.0" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="326" width="184" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="664" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選 3：範圍內 sensor</text>
  <text x="664" y="358" text-anchor="middle" font-size="11" fill="#085041">L3 × 25（例 L3 ＝ 12）</text>
  <line x1="664.0" y1="364" x2="664.0" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="326" width="184" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="860" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">候選 4：範圍內 sensor</text>
  <text x="860" y="358" text-anchor="middle" font-size="11" fill="#085041">L4 × 25（例 L4 ＝ 1）</text>
  <line x1="860.0" y1="364" x2="860.0" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="394" font-size="12" font-weight="bold" fill="#3C3489">第 1 步</text>
  <text x="40" y="409" font-size="11" fill="#5F5E5A">整理每顆 sensor</text>
  <rect x="180" y="378" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="272" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">每顆 25 → 64 → 64</text>
  <text x="272" y="410" text-anchor="middle" font-size="11" fill="#3C3489">→ L1 × 64</text>
  <line x1="272.0" y1="416" x2="272.0" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="378" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="468" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">每顆 25 → 64 → 64</text>
  <text x="468" y="410" text-anchor="middle" font-size="11" fill="#3C3489">→ L2 × 64</text>
  <line x1="468.0" y1="416" x2="468.0" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="378" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="664" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">每顆 25 → 64 → 64</text>
  <text x="664" y="410" text-anchor="middle" font-size="11" fill="#3C3489">→ L3 × 64</text>
  <line x1="664.0" y1="416" x2="664.0" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="378" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="860" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">每顆 25 → 64 → 64</text>
  <text x="860" y="410" text-anchor="middle" font-size="11" fill="#3C3489">→ L4 × 64</text>
  <line x1="860.0" y1="416" x2="860.0" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="446" font-size="12" font-weight="bold" fill="#3C3489">第 2 步</text>
  <text x="40" y="461" font-size="11" fill="#5F5E5A">合成一個候選</text>
  <rect x="180" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="272" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="272" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="272.0" y1="468" x2="272.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="468" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="468" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="468.0" y1="468" x2="468.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="664" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="664" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="664.0" y1="468" x2="664.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="430" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="860" y="447" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">平均 ‖ 最大</text>
  <text x="860" y="462" text-anchor="middle" font-size="11" fill="#3C3489">→ 128（不管 L 多少）</text>
  <line x1="860.0" y1="468" x2="860.0" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="498" font-size="12" font-weight="bold" fill="#3C3489">第 3 步</text>
  <text x="40" y="513" font-size="11" fill="#5F5E5A">加上候選特徵、全域</text>
  <rect x="180" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="272" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 1 特徵 10 ‖ 全域 10</text>
  <text x="272" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u1</text>
  <line x1="272.0" y1="520" x2="272.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="468" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 2 特徵 10 ‖ 全域 10</text>
  <text x="468" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u2</text>
  <line x1="468.0" y1="520" x2="468.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="572" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="664" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 3 特徵 10 ‖ 全域 10</text>
  <text x="664" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u3</text>
  <line x1="664.0" y1="520" x2="664.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="482" width="184" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="860" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">‖ 候選 4 特徵 10 ‖ 全域 10</text>
  <text x="860" y="514" text-anchor="middle" font-size="11" fill="#3C3489">148→128→64 ＝ u4</text>
  <line x1="860.0" y1="520" x2="860.0" y2="534" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="550" font-size="12" font-weight="bold" fill="#72243E">第 4 步</text>
  <text x="40" y="565" font-size="11" fill="#5F5E5A">每個候選一個分數</text>
  <rect x="180" y="534" width="184" height="38" rx="6" fill="#FBEAF0" stroke="#993556"/>
  <text x="272" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#72243E">u1 → 1 ＝ 分數 s1</text>
  <text x="272" y="566" text-anchor="middle" font-size="11" fill="#72243E">越高越該選</text>
  <rect x="376" y="534" width="184" height="38" rx="6" fill="#FBEAF0" stroke="#993556"/>
  <text x="468" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#72243E">u2 → 1 ＝ 分數 s2</text>
  <text x="468" y="566" text-anchor="middle" font-size="11" fill="#72243E">越高越該選</text>
  <rect x="572" y="534" width="184" height="38" rx="6" fill="#FBEAF0" stroke="#993556"/>
  <text x="664" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#72243E">u3 → 1 ＝ 分數 s3</text>
  <text x="664" y="566" text-anchor="middle" font-size="11" fill="#72243E">越高越該選</text>
  <rect x="768" y="534" width="184" height="38" rx="6" fill="#FBEAF0" stroke="#993556"/>
  <text x="860" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#72243E">u4 → 1 ＝ 分數 s4</text>
  <text x="860" y="566" text-anchor="middle" font-size="11" fill="#72243E">越高越該選</text>
  <line x1="272.0" y1="572" x2="272.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468.0" y1="572" x2="468.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="664.0" y1="572" x2="664.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860.0" y1="572" x2="860.0" y2="592" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="594" width="780" height="44" rx="6" fill="#534AB7" stroke="#534AB7"/>
  <text x="570" y="613" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">softmax(s1, s2, s3, s4) → 機率 π1、π2、π3、π4（加起來 = 1）</text>
  <text x="570" y="630" text-anchor="middle" font-size="11" fill="#ffffff">選機率最大的候選</text>
  <text x="40" y="612" font-size="12" font-weight="bold" fill="#534AB7">第 5 步</text>
  <text x="40" y="627" font-size="11" fill="#5F5E5A">4 個一起比</text>
  <text x="570" y="656" text-anchor="middle" font-size="11" fill="#5F5E5A">例：分數 s＝0.5、2.0、−1.0、0.0 → 機率 16%、71%、4%、10% → 選候選 2</text>
  <text x="40" y="678" font-size="11" fill="#993C1D">和 E06 比：拿掉 sensor Transformer、範圍外 sensor、候選間 attention。E06 拿掉 Transformer（0 層）945.7 對 944.6，沒差</text>

  <!-- ④ 訓練 -->
  <rect x="30" y="712" width="940" height="128" rx="10" fill="#FBEAF0" stroke="#993556"/>
  <text x="50" y="736" font-size="14" font-weight="bold" fill="#72243E">④ 訓練（train_sup.py）</text>
  <g fill="#72243E">
    <text x="50" y="762"><tspan font-weight="bold">損失</tspan>　交叉熵 −log π_(作弊版選的候選)，全部交易都用</text>
    <text x="50" y="780" font-size="11">　　　　例：作弊版選候選 2，網路給它 71% → 損失 −log 0.71 ＝ 0.34；若作弊版選候選 3（網路只給 4%）→ 損失 3.2，候選 3 的分數會被往上調</text>
    <text x="50" y="804"><tspan font-weight="bold">設定</tspan>　Adam 3e-4（cosine 衰減）、L2 1e-5、batch 256、固定 5 個 epoch、不早停；評估用最後一個 checkpoint</text>
    <text x="50" y="824"><tspan font-weight="bold">記錄</tspan>　每 epoch 訓練集交叉熵、和作弊版一致的比例（隨機 25%）、4 個位置被選比例</text>
  </g>

  <!-- ⑤ 評估 -->
  <rect x="30" y="852" width="940" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="500" y="872" text-anchor="middle" font-weight="bold" fill="#085041">⑤ 評估：MAP01–06 × seed 7–36（180 場），預算 10000，成對 Wilcoxon 對 ring_se 1064.6、E07 D3QN</text>
  <text x="500" y="890" text-anchor="middle" fill="#085041">時間：蒐集約 1 小時 → 訓練約 20 分 → 評估約 2.5–3 小時（ring_se 10000 每場約 5 分，加上網路推論）</text>
  <text x="500" y="906" text-anchor="middle" font-size="11" fill="#993C1D">天花板很低：作弊版只 +1.5%，網路拿到一半約 +0.8%（約 8 單位）</text>
</svg>
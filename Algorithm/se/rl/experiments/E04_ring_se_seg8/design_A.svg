<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950" font-family="Helvetica, Arial, 'Noto Sans CJK TC', sans-serif" font-size="12">
  <rect width="900" height="950" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2C2C2A">E04 設計 A：ring_se 環切 8 段、整段交換，串接＋經典 Dueling 選段</text>

  <!-- ① 問題設定 -->
  <rect x="40" y="52" width="820" height="46" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="450" y="72" text-anchor="middle" font-weight="bold" fill="#2C2C2A">① 每組 searcher-good 交易：環固定切 8 段（每段 12–13 顆 sensor），網路選 1 段</text>
  <text x="450" y="89" text-anchor="middle" fill="#2C2C2A">選到第 k 段就交換、突變第 k 段全部 sensor（範圍不再隨機）；作弊版天花板：1000 +7.9%、3000 +0.1%</text>

  <!-- ② 輸入 -->
  <rect x="30" y="114" width="840" height="246" rx="12" fill="none" stroke="#0F6E56" stroke-dasharray="7 4"/>
  <text x="450" y="134" text-anchor="middle" font-weight="bold" fill="#0F6E56">② 輸入（與設計 B 相同，只差段編號）</text>
  <text x="450" y="352" text-anchor="middle" fill="#993C1D">（改）所有特徵先做 z-score 標準化：平均／標準差用隨機策略的資料算一次後固定</text>

  <rect x="46" y="146" width="300" height="192" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <g fill="#085041">
    <text x="58" y="166" font-weight="bold">每顆 sensor 一個 token · 25 維（同 E03）</text>
    <text x="58" y="186">每段 13 個（不足補零遮罩）</text>
    <text x="58" y="208" font-weight="bold">S、G 解碼後各 10 維（共 20）：</text>
    <text x="58" y="226">開關、等級、轉送、轉送量、子樹大小、</text>
    <text x="58" y="242">跳數、耗能、緊迫度、覆蓋數、唯一覆蓋數</text>
    <text x="58" y="264" font-weight="bold">共用 2 維：</text>
    <text x="58" y="282">剩餘電量 E/E0、離 BS 距離</text>
    <text x="58" y="304" font-weight="bold">差異旗標 3 維：</text>
    <text x="58" y="322">開關不同、等級不同、priority 不同</text>
  </g>

  <rect x="360" y="146" width="290" height="192" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <g fill="#085041">
    <text x="372" y="166" font-weight="bold">每段額外特徵 · 7 維</text>
    <text x="372" y="190">· 瓶頸分數 b_k：有效差異 sensor 在 S、G</text>
    <text x="384" y="206">的緊迫度總和（E03 瓶頸規則的分數）</text>
    <text x="372" y="228">· 有效差異數、無效差異數</text>
    <text x="372" y="250">· 範圍外影響 4 維（同 E03）：</text>
    <text x="384" y="266">段外路由經過本段（S、G）、</text>
    <text x="384" y="282">本段 target 段外無備援（S、G）</text>
    <text x="372" y="306" fill="#993C1D">（改）拿掉段編號 one-hot 8 維：</text>
    <text x="384" y="322" fill="#993C1D">串接的位置已代表段號</text>
  </g>

  <rect x="664" y="146" width="192" height="192" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <g fill="#085041">
    <text x="676" y="166" font-weight="bold">全域 · 10 維（同 E03）</text>
    <text x="676" y="190">搜尋進度</text>
    <text x="676" y="208">searcher 停滯</text>
    <text x="676" y="226">平均剩餘電量</text>
    <text x="676" y="244">fitness 差距排名</text>
    <text x="676" y="262">S／G 覆蓋率</text>
    <text x="676" y="280">S／G 最短壽命差</text>
    <text x="676" y="298">S／G 開啟數</text>
    <text x="676" y="316">基因不同比例</text>
  </g>

  <!-- ③ 段編碼器 -->
  <line x1="350" y1="360" x2="350" y2="380" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="382" width="520" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <g fill="#3C3489">
    <text x="350" y="402" text-anchor="middle" font-weight="bold">③ 段編碼器（8 段共用權重）</text>
    <text x="350" y="420" text-anchor="middle">13 token → φ：25→64→64 → 遮罩後 平均 ‖ 最大 ‖ 總和÷13（192）</text>
    <text x="350" y="437" text-anchor="middle">‖ 段特徵 7 → MLP 199→128→64，得到段向量 h₀ … h₇</text>
    <text x="350" y="454" text-anchor="middle" fill="#993C1D">（改）原本是單層 207→64；改兩層，讓段特徵和 token 摘要能交互</text>
  </g>

  <!-- ④ 網路 -->
  <rect x="30" y="482" width="840" height="212" rx="12" fill="none" stroke="#534AB7" stroke-dasharray="7 4"/>
  <text x="450" y="504" text-anchor="middle" font-size="14" font-weight="bold" fill="#534AB7">④ 串接＋經典 Dueling（約 14 萬參數）</text>
  <line x1="350" y1="464" x2="350" y2="480" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="11" fill="#3C3489">
    <rect x="250" y="518" width="44" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="272" y="536" text-anchor="middle">h₀</text>
    <rect x="298" y="518" width="44" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="320" y="536" text-anchor="middle">h₁</text>
    <text x="360" y="536" text-anchor="middle">…</text>
    <rect x="378" y="518" width="44" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="400" y="536" text-anchor="middle">h₇</text>
    <rect x="432" y="518" width="76" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="470" y="536" text-anchor="middle" fill="#085041">全域 10</text>
  </g>
  <text x="520" y="536" fill="#2C2C2A">依段號固定順序串接：8×64＋10＝522 維</text>
  <line x1="760" y1="338" x2="760" y2="532" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="760" y1="532" x2="740" y2="532" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="768" y="440" fill="#5F5E5A">全域</text>

  <line x1="380" y1="548" x2="380" y2="572" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="574" width="220" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="380" y="599" text-anchor="middle" fill="#3C3489">共用層 522→128→128（ReLU）</text>
  <line x1="340" y1="614" x2="290" y2="642" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="614" x2="470" y2="642" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="644" width="150" height="40" rx="8" fill="#FBEFD5" stroke="#BA7517"/>
  <text x="275" y="669" text-anchor="middle" fill="#633806">V：128→64→1</text>
  <rect x="400" y="644" width="150" height="40" rx="8" fill="#FBEFD5" stroke="#BA7517"/>
  <text x="475" y="669" text-anchor="middle" fill="#633806">A：128→64→8</text>
  <text x="562" y="661" fill="#2C2C2A" font-size="11">第 k 個輸出固定＝第 k 段</text>
  <text x="562" y="677" fill="#2C2C2A" font-size="11">（每段有自己的輸出權重）</text>


  <!-- ⑤ 輸出 -->
  <line x1="450" y1="694" x2="450" y2="712" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="714" width="820" height="46" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="450" y="734" text-anchor="middle" font-weight="bold" fill="#2C2C2A">⑤ Q_k = V + A_k − mean(A)，k = 0…7（每段一個 Q）</text>
  <text x="450" y="751" text-anchor="middle" fill="#2C2C2A">選 Q 最大的段 → 交換＋突變整段 → 照常 EN 更新</text>

  <!-- 優缺點 -->
  <rect x="40" y="776" width="400" height="160" rx="8" fill="#ffffff" stroke="#0F6E56"/>
  <g fill="#2C2C2A">
    <text x="56" y="798" font-weight="bold" fill="#0F6E56">優點</text>
    <text x="56" y="820">· 原論文（Wang et al., 2016）的經典 Dueling 結構</text>
    <text x="56" y="842">· 每段有自己的輸出權重，能學「段 0 靠近 BS</text>
    <text x="68" y="858">要另外判斷」這類段專屬規則</text>
    <text x="56" y="880">· 結構簡單，RL 訓練較穩</text>
  </g>
  <rect x="460" y="776" width="400" height="160" rx="8" fill="#ffffff" stroke="#993C1D"/>
  <g fill="#2C2C2A">
    <text x="476" y="798" font-weight="bold" fill="#993C1D">缺點</text>
    <text x="476" y="820">· 段和段的比較要靠 MLP 自己學</text>
    <text x="476" y="842">· 段之間的輸出權重不共用，資料效率較低</text>
    <text x="476" y="864">· RL 時 A 的第 k 個輸出只從選到第 k 段的</text>
    <text x="488" y="880">轉移學；ε 變小後冷門段樣本很少</text>
    <text x="476" y="902">· 段之間的遠近（段 k 和 k±1 相鄰，</text>
    <text x="488" y="918">段 0 最內圈）要從串接位置自己學</text>
  </g>
</svg>
